# 끝난 시즌의 정확한 SHAP 캐시 (시즌당 약 12시간 -> 8조각 병렬) -> 그 시즌 웹 데이터 재생성 -> 배포
# 진행 중인 시즌은 매일 피처(투수별 주 패스트볼 평균)가 바뀌므로 Saabas 기여를 쓴다
name: shap

on:
  push:
    branches: [main]
    paths: ['models/**']
  schedule:
    - cron: '0 18 1 * *'    # 매월 2일 03:00 KST : 새로 끝난 시즌 확인
  workflow_dispatch:
    inputs:
      seasons:
        description: '계산할 시즌 JSON (예 [2025]) — 비우면 끝난 시즌 중 캐시 없는 시즌'
        default: ''

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET: ${{ vars.HF_DATASET || 'yongwon38/mlb-statcast' }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  MLB_DATA: store
  N_SHARDS: 8

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seasons: ${{ steps.todo.outputs.seasons }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - id: todo
        env:
          INPUT_SEASONS: ${{ inputs.seasons }}
        run: |
          if [ -n "$INPUT_SEASONS" ]; then echo "seasons=$INPUT_SEASONS" >> "$GITHUB_OUTPUT"
          else python ops.py shap-todo; fi

  shard:
    needs: plan
    if: needs.plan.outputs.seasons != '[]' && needs.plan.outputs.seasons != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJSON(needs.plan.outputs.seasons) }}
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: |
          python compute_shap.py ${{ matrix.season }} --shard ${{ matrix.shard }} --n-shards $N_SHARDS
          D=$(python -c "import export_web_data as e; print(e.SHAP_DIR)")
          mkdir -p shap_out
          cp "$D"/shard_*.npz shap_out/
          if ls "$D"/shap_*_extra.npz >/dev/null 2>&1; then cp "$D"/shap_*_extra.npz shap_out/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: shap-${{ matrix.season }}-${{ matrix.shard }}
          path: shap_out/
          retention-days: 3

  merge:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - name: SHAP 폴더
        id: dir
        run: echo "path=$(python -c "import export_web_data as e; print(e.SHAP_DIR)")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: shap-*
          merge-multiple: true
          path: ${{ steps.dir.outputs.path }}
      - name: 조각 합치기 + 업로드
        env:
          SEASONS_JSON: ${{ needs.plan.outputs.seasons }}
        run: |
          S=$(python -c "import json, os; print(*json.loads(os.environ['SEASONS_JSON']))")
          python compute_shap.py $S --merge --n-shards $N_SHARDS
          python ops.py push-shap $S
          echo "S=$S" >> "$GITHUB_ENV"
      - name: 지난 시즌 웹 데이터 스냅샷
        id: web
        run: python ops.py pull-web --skip $S
      - name: 해당 시즌 웹 데이터 재생성 (SHAP 적용)
        run: |
          python export_web_data.py --seasons $S ${{ steps.web.outputs.missing }}
          python ops.py push-web $S ${{ steps.web.outputs.missing }}
      - uses: ./.github/actions/deploy-web
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
